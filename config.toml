[paths]
checkpoints_dir = "checkpoints"

[board]
rows = 6
cols = 7

[model]
channels = 64
kernel_size = 3
blocks = 4

[training]
iterations = 48
num_games = 64
tree_size = 5
batch_size = 640
num_batches = 10
buffer_size = 6400
learning_rate = 0.001
checkpoint_frequency = 2
eval_num_games = 100
eval_tree_size = 5
